<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#155eef">
  <title>Phone OTP Registration</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <div class="logo">✓</div>
    <h1>Create your account</h1>
    <p class="subtitle">Verify your mobile number to register.</p>

    <form id="registrationForm">
      <label for="name">Full name</label>
      <input
        id="name"
        name="name"
        type="text"
        minlength="2"
        maxlength="80"
        autocomplete="name"
        placeholder="Enter your full name"
        required
      >

      <label for="phone">Mobile number</label>
      <input
        id="phone"
        name="phone"
        type="tel"
        autocomplete="tel"
        placeholder="+919876543210"
        pattern="^\+[1-9][0-9]{7,14}$"
        title="Use international format, for example +919876543210"
        required
      >
      <p class="hint">Include the country code, e.g. +91 for India.</p>

      <div id="recaptcha-container"></div>

      <button id="sendOtpBtn" type="button">
        Send verification OTP
      </button>

      <section id="otpSection" hidden>
        <label for="otp">6-digit verification code</label>
        <input
          id="otp"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9]{6}"
          maxlength="6"
          placeholder="Enter OTP"
        >
        <button id="verifyBtn" type="submit">
          Verify and register
        </button>
      </section>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="successPanel" hidden>
      <h2>Registration complete!</h2>
      <p id="profile"></p>
      <button id="logoutBtn" type="button" class="secondary">
        Sign out
      </button>
    </section>

    <p class="fine-print">
      By continuing, you agree to receive an SMS for phone verification. Standard messaging rates may apply.
    </p>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
